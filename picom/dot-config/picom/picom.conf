# Backend - use glx for better performance
backend = "glx";

# VSync - prevents screen tearing
vsync = true;

# GLX backend specific options
glx-no-stencil = true;
glx-copy-from-front = false;
glx-no-rebind-pixmap = true;

# Other useful options for Intel graphics
detect-transient = true;
detect-client-leader = true;
#backend = "xrender";
rules: ({
  match = "class_g = 'XTerm' && focused";
  opacity = 0.9;
}, {
  match = "(class_g = 'XTerm' || class_g = 'Gnome_terminal')"
          " && !focused";
  opacity = 0.9;
})

# Animations
animations = true;
animation-stiffness = 1000;
animation-dampening = 22;
animation-clamping = true;
animation-mass = 1;
animation-for-workspace-switch-in = "auto";
animation-for-workspace-switch-out = "auto";
animation-for-open-window = "slide-up";
animation-for-menu-window = "slide-down";
animation-for-transient-window = "slide-down"


# Workspace animations (if supported)
animation-for-prev-tag = "minimize";
animation-for-next-tag = "slide-out-center";
